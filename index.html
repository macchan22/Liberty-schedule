<title>Liberty 出欠確認</title>
<style>
:root{
  --green:#1b7f4b; --green-d:#136138; --green-l:#e8f5ec;
  --sun:#ffd23f;
  --bg:#eef4ef; --card:#ffffff; --ink:#14261a; --muted:#5d7264; --line:#e2ece5;
  --allday:#17924f; --am:#e07b00; --pm:#1f6fd0; --undec:#7350cf; --absent:#d64545; --none:#5f6f66;
  --r:20px; --tap:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:18px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  font-size:1rem;line-height:1.55;overflow-x:hidden;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
img,svg{max-width:100%}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #0b5fbf;outline-offset:2px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#1b7f4b 0%,#25a05c 100%);
  color:#fff;padding:calc(9px + env(safe-area-inset-top)) 14px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 3px 14px rgba(14,70,40,.28);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .ball{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.brand .bt{font-size:1.42rem;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
.mepill{
  border:0;background:rgba(255,255,255,.19);color:#fff;font-weight:800;
  border-radius:999px;padding:9px 14px;font-size:.98rem;min-height:44px;
  max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:2px solid rgba(255,255,255,.34);display:flex;align-items:center;gap:6px;
}
.mepill.unset{background:var(--sun);color:#173a20;border-color:#ffdf6e}
.iconbtn{
  border:2px solid rgba(255,255,255,.34);background:rgba(255,255,255,.19);color:#fff;
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
}
.iconbtn:active{transform:scale(.95)}

/* ---------- layout ---------- */
main{padding:16px 14px 10px;max-width:640px;margin:0 auto}
.sectitle{display:flex;align-items:center;gap:8px;margin:22px 2px 12px;font-size:1.06rem;font-weight:800;color:var(--green-d)}
.sectitle::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--green);display:block}
.sectitle.first{margin-top:4px}

/* ---------- hero (next event) ---------- */
.hero{
  position:relative;background:linear-gradient(140deg,#1b7f4b 0%,#2aa866 62%,#35b972 100%);
  color:#fff;border-radius:24px;padding:18px 18px 16px;
  box-shadow:0 10px 26px rgba(18,88,50,.30);overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.28), rgba(255,255,255,0) 68%);
}
.hlabel{display:inline-block;background:var(--sun);color:#14401f;font-weight:800;border-radius:999px;padding:4px 14px;font-size:.86rem;letter-spacing:.05em}
.hdate{font-size:2.05rem;font-weight:800;line-height:1.18;margin-top:10px;letter-spacing:.01em}
.hsub{font-size:1.16rem;font-weight:700;margin-top:4px;opacity:.97}
.hplace{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:1.02rem;font-weight:700;opacity:.95}
.hero .total{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.3)}
.hero .total .n{color:#fff}
.hero .total .tl{color:#eafaf0}
.hero .cell{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.hero .cell .n{color:#fff}
.hero .cell .l{color:#dcf3e5}
.hero .go{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:#fff;color:var(--green-d);border-radius:16px;min-height:58px;font-size:1.16rem;font-weight:800;border:0;width:100%}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:13px;box-shadow:0 2px 10px rgba(20,60,35,.07)}
.card.tap{width:100%;text-align:left;display:block}
.card.tap:active{transform:scale(.994);background:#fbfdfb}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cdate{font-size:1.52rem;font-weight:800;line-height:1.2}
.ctype{display:inline-block;border-radius:10px;padding:6px 12px;font-size:.98rem;font-weight:800;white-space:nowrap;flex:0 0 auto;margin-left:auto}
.t-練習{background:#e6f2ff;color:#155fa8}
.t-試合{background:#ffeaea;color:#b52b2b}
.t-大会{background:#fff2cf;color:#8a6100}
.t-練習試合{background:#f0e9ff;color:#5b34b8}
.t-その他{background:#eef1ef;color:#4c6155}
.cplace{display:flex;align-items:flex-start;gap:7px;margin-top:8px;font-size:1.04rem;font-weight:700;color:#3d5347}
.cplace svg{flex:0 0 auto;margin-top:3px}

/* counts */
.total{display:flex;align-items:center;gap:13px;background:var(--green-l);border:1px solid #d3e9da;border-radius:16px;padding:12px 16px;margin-top:12px}
.total .n{font-size:2.9rem;font-weight:900;color:var(--green);line-height:1;letter-spacing:-.01em}
.total .tl{font-size:1.12rem;font-weight:800;color:#3d6b50;line-height:1.25}
.total .sp{flex:1 1 auto}
.total .un{font-size:.95rem;font-weight:800;color:#7b6a2e;background:#fff5d6;border-radius:999px;padding:4px 11px;white-space:nowrap}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.cell{background:#f5f9f6;border:1px solid #e7efe9;border-radius:14px;padding:8px 2px;text-align:center}
.cell .n{font-size:1.5rem;font-weight:800;line-height:1.12}
.cell .l{font-size:.86rem;font-weight:800;color:var(--muted);letter-spacing:.02em}
.cell.c-allday .n{color:var(--allday)} .cell.c-am .n{color:var(--am)}
.cell.c-pm .n{color:var(--pm)} .cell.c-undecided .n{color:var(--undec)}
.cell.c-absent .n{color:var(--absent)} .cell.c-none .n{color:var(--none)}

.openhint{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:11px;background:var(--green-l);color:var(--green-d);border-radius:13px;min-height:50px;font-size:1.05rem;font-weight:800}
.openhint .ar{font-size:1.45rem;line-height:1;font-weight:700}
.hero .openhint{background:rgba(255,255,255,.16);color:#fff}
/* ---------- detail ---------- */
.backbtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:52px;padding:0 16px;font-size:1.06rem;font-weight:800;color:var(--green-d);margin-bottom:14px}
.dhead{background:linear-gradient(140deg,#1b7f4b,#2aa866);color:#fff;border-radius:22px;padding:17px;box-shadow:0 8px 22px rgba(18,88,50,.26)}
.dhead .hdate{font-size:1.95rem;margin-top:8px}
.dhead .hplace{opacity:.96}
.yourbox{background:#fff;border:3px solid var(--sun);border-radius:22px;padding:15px;margin-top:16px;box-shadow:0 4px 16px rgba(180,140,20,.14)}
.yourbox .yt{font-size:1.1rem;font-weight:800;color:#8a6100;display:flex;align-items:center;gap:7px}
.yourbox .yname{font-size:1.3rem;font-weight:800;margin:6px 0 12px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;min-height:var(--tap);
  border:3px solid #dfe8e2;background:#fff;border-radius:17px;padding:0 15px;
  font-size:1.24rem;font-weight:800;color:var(--ink);margin-bottom:10px;text-align:left;
}
.opt:active{transform:scale(.99)}
.opt .dot{width:32px;height:32px;flex:0 0 auto;border-radius:50%;border:3px solid #cfdcd3;background:#fff;display:grid;place-items:center}
.opt .dot svg{opacity:0;transition:opacity .12s}
.opt.sel{border-color:var(--c);background:#f4fbf6}
.opt.sel .dot{background:var(--c);border-color:var(--c)}
.opt.sel .dot svg{opacity:1}
.btn-primary{width:100%;min-height:var(--tap);border:0;border-radius:17px;background:var(--green);color:#fff;font-size:1.32rem;font-weight:800;box-shadow:0 6px 16px rgba(27,127,75,.34);margin-top:4px}
.btn-primary:active{transform:scale(.99)}
.btn-primary:disabled{background:#c3d3c9;box-shadow:none;color:#f2f6f3}
.pickcta{width:100%;min-height:76px;border:3px dashed #b9d3c3;background:#f7fbf8;border-radius:18px;font-size:1.2rem;font-weight:800;color:var(--green-d);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.curr{display:flex;align-items:center;gap:9px;background:#f4f8f5;border-radius:14px;padding:11px 14px;margin-bottom:13px;font-weight:800;font-size:1.05rem}
.curr .k{width:14px;height:14px;border-radius:50%;background:var(--c);flex:0 0 auto}

.grp{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px}
.grp .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;color:#fff;font-weight:800;font-size:1.08rem}
.grp .gh .gc{background:rgba(255,255,255,.26);border-radius:999px;padding:2px 12px;font-size:1rem}
.grp .gb{padding:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f1f6f3;border:1px solid #e4ede7;border-radius:999px;padding:9px 15px;font-weight:800;font-size:1.02rem}
.grp.empty .gb{padding:0}
.nobody{color:var(--muted);font-weight:700;font-size:.98rem;padding:2px}

/* ---------- admin ---------- */
.adminbar{display:grid;gap:10px;margin-bottom:16px}
.abtn{min-height:62px;border-radius:16px;border:0;font-size:1.16rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.abtn.add{background:var(--sun);color:#173a20;border-bottom:4px solid #e0b520}
.abtn.g{background:#fff;color:var(--green-d);border:2px solid #cfe3d7}
.abtn.r{background:#fff;color:#b52b2b;border:2px solid #f0cccc}
.adminnote{background:#fff8e1;border:2px solid #ffe08a;border-radius:16px;padding:12px 14px;font-size:.98rem;font-weight:700;color:#7a5c00;margin-bottom:14px}
.rowbtns{display:flex;gap:9px;margin-top:12px}
.rowbtns button{flex:1;min-height:54px;border-radius:14px;font-size:1.05rem;font-weight:800}
.bedit{background:#eaf3ff;color:#155fa8;border:2px solid #cfe3f8}
.bdel{background:#fff;color:#b52b2b;border:2px solid #f0cccc}

        <path d="M35.4 14.2l-3.6 2M37.4 20.4h-3.6M37.4 27.6h-3.6M35.4 33.8l-3.6-2"/>

      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.1 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a1.95 1.95 0 1 1-3.9 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a1.95 1.95 0 1 1 0-3.9h.1A1.6 1.6 0 0 0 4.57 8.3a1.6 1.6 0 0 0-.32-1.77l-.06-.06A1.95 1.95 0 1 1 6.95 3.7l.06.06a1.6 1.6 0 0 0 1.77.32H8.9a1.6 1.6 0 0 0 .97-1.47V3a1.95 1.95 0 1 1 3.9 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97H21a1.95 1.95 0 1 1 0 3.9h-.1a1.6 1.6 0 0 0-1.47.97z"/>

<main id="view" aria-live="polite"></main>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<noscript><p style="padding:20px;font-weight:800">この出欠アプリを使うには、スマートフォンのブラウザでJavaScriptを有効にしてください。</p></noscript>

<script>
/* =========================================================
   Liberty 出欠確認アプリ
   ・一般メンバー：名前を選んで5つから1つ押すだけ
   ・管理者：予定の追加・編集・削除、メンバー管理
   ========================================================= */
(function(){
"use strict";

/* ---------- 基本定数 ---------- */
var CHOICES = [
  {key:"am",        label:"午前",   short:"午前",   color:"var(--am)"},
  {key:"pm",        label:"午後",   short:"午後",   color:"var(--pm)"},
  {key:"undecided", label:"調整中", short:"調整中", color:"var(--undec)"},
  {key:"absent",    label:"欠席",   short:"欠席",   color:"var(--absent)"}
];
/* 以前の「終日参加」は一覧・集計から外しましたが、データは残し、午前として数えます */
var CHOICE_KEYS = ["am","pm","undecided","absent","allday"];
function isAttend(v){ return v==="am" || v==="pm" || v==="allday"; }
function choiceLabel(v){
  if(v==="allday") return "午前（終日）";
  for(var i=0;i<CHOICES.length;i++){ if(CHOICES[i].key===v) return CHOICES[i].label; }
  return "";
}
var WEEK = ["日","月","火","水","木","金","土"];
var CHECK = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-10.5"/></svg>';
var PIN_ICON = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
var PLACE_ICON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7-6.1 7-11.2A7 7 0 0 0 5 10.3c0 5.1 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.5"/></svg>';

var state = {members:[], events:[], settings:{}};
var MODE = "local";
var me = null;                 // 選択中の自分の名前
var adminPin = null;           // 認証済み暗証番号（セッション内のみ）
var liveTimer = null;

/* ---------- ストレージ ---------- */
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function sessGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function sessSet(k,v){ try{ if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){} }

function apiBase(){
  var q = null;
  try{ q = new URLSearchParams(location.search).get("api"); }catch(e){}
  var b = q || safeGet("liberty_api") || "";
  b = String(b).replace(/\/+$/,"");
  return b + "/api";
}

var LOCAL_KEY = "liberty_state_v1";
function localRead(){
  try{
    var raw = safeGet(LOCAL_KEY);
    if(raw){ var o = JSON.parse(raw); if(o && o.events) return o; }
  }catch(e){}
  return { members: DEFAULT_MEMBERS.slice(), events: [], settings:{pin:"0000"} };
}
function localWrite(){
  try{ safeSet(LOCAL_KEY, JSON.stringify(state)); }catch(e){}
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ---------- API ---------- */
function req(path, method, body, pin){
  var opt = { method: method||"GET", cache:"no-store", headers:{} };
  if(body){ opt.headers["content-type"]="application/json"; opt.body = JSON.stringify(body); }
  if(pin || adminPin){ opt.headers["x-admin-pin"] = pin || adminPin; }
  return fetch(apiBase()+path, opt).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){ var err = new Error(j.error || ("エラー ("+r.status+")")); err.status = r.status; throw err; }
      return j;
    });
  });
}

function loadState(){
  return req("/state").then(function(j){
    MODE = "server";
    state = normalizeState({ members: j.members||[], events: j.events||[], settings: j.settings||{} });
    return true;
  }).catch(function(){
    MODE = "local";
    state = normalizeState(localRead());
    return false;
  });
}

/* 変更系：成功したら新しい state を返す */
function applyLocal(fn){
  fn();
  state.events.sort(sortByDate);
  localWrite();
  return Promise.resolve(state);
}
function mutate(path, method, body){
  if(MODE === "server"){
    return req(path, method, body).then(function(j){
      if(j && j.events){ state = normalizeState({ members:j.members||[], events:j.events||[], settings:j.settings||{} }); }
      return state;
    });
  }
  return applyLocal(function(){ mutateLocal(path, method, body); });
}
function mutateLocal(path, method, body){
  var m;
  if(path === "/events" && method === "POST"){
    state.events.push({ id:uid(), date:body.date, type:body.type, place:body.place||"", note:"", responses:{} });
  } else if((m = path.match(/^\/events\/([^/]+)\/answer$/))){
    var ev = findEvent(m[1]);
    if(ev){ if(body.choice === null){ delete ev.responses[body.member]; } else { ev.responses[body.member] = body.choice; } }
  } else if((m = path.match(/^\/events\/([^/]+)$/))){
    var ev2 = findEvent(m[1]);
    if(ev2){
      if(method === "PUT"){ if(body.date)ev2.date=body.date; if(body.type)ev2.type=body.type; if("place" in body)ev2.place=body.place; }
      if(method === "DELETE"){ state.events = state.events.filter(function(e){ return e.id !== m[1]; }); }
    }
  } else if(path === "/members" && method === "POST"){
    state.members.push({ id:"m"+uid(), name:String(body.name||""), number:body.number });
    state.members.forEach(function(mm){ if(mm.number===""||mm.number===undefined) mm.number=null; });
    sortMemberList(state.members);
  } else if((m = path.match(/^\/members\/([^/]+)$/))){
    var mid = m[1];
    if(method === "PUT"){
      state.members.forEach(function(mm){
        if(mm.id !== mid) return;
        if("name" in body) mm.name = String(body.name||"");
        if("number" in body) mm.number = (body.number===null||body.number===undefined||body.number==="") ? null : Number(body.number);
      });
      sortMemberList(state.members);
    }
    if(method === "DELETE"){
      state.members = state.members.filter(function(mm){ return mm.id !== mid; });
      state.events.forEach(function(e){ delete e.responses[mid]; });
    }
  } else if(path === "/pin" && method === "POST"){
    state.settings.pin = body.pin;
  }
}
function findEvent(id){ for(var i=0;i<state.events.length;i++){ if(state.events[i].id===id) return state.events[i]; } return null; }

/* ---------- メンバー（背番号＋ニックネーム） ---------- */
function hasNum(m){ return !!(m && m.number!==null && m.number!==undefined && m.number!==""); }
function memberById(id){ for(var i=0;i<state.members.length;i++){ if(state.members[i].id===id) return state.members[i]; } return null; }
function dispName(m){ if(!m) return ""; return hasNum(m) ? (m.number+"　"+m.name) : m.name; }
function numBadge(m, cls){ return hasNum(m) ? '<span class="'+(cls||"numbadge")+'">'+esc(m.number)+'</span>' : ""; }
function nameChip(m, extra){ return '<span class="chip">'+numBadge(m,"cn")+esc(m.name)+(extra||"")+'</span>'; }
function sortMemberList(arr){
  /* 並べ替えは行いません。登録した順番のまま表示します。 */
  return arr;
}
/* 旧形式（名前だけの配列）や端末内データを新形式へそろえる */
function normalizeState(s){
  s = s || {};
  var ms = Array.isArray(s.members) ? s.members : [];
  s.events = Array.isArray(s.events) ? s.events : [];
  s.settings = s.settings || {};
  if(ms.length && typeof ms[0] === "string"){
    var map = {};
    s.members = ms.map(function(n,i){
      var id = "m" + (i+1) + "_" + uid().slice(0,3);
      map[n] = id;
      return { id:id, name:String(n), number:null };
    });
    s.events.forEach(function(ev){
      var r = ev.responses || {}, nr = {};
      Object.keys(r).forEach(function(k){ if(map[k]) nr[map[k]] = r[k]; });
      ev.responses = nr;
    });
  } else {
    s.members = ms.map(function(m){
      if(typeof m === "string") return { id:"m"+uid(), name:m, number:null };
      return { id: m.id || ("m"+uid()), name: String(m.name||""), number: m.number };
    });
  }
  s.members.forEach(function(m){
    if(m.number === null || m.number === undefined || m.number === ""){ m.number = null; return; }
    var n = Number(m.number);
    m.number = isNaN(n) ? null : n;
  });
  s.events.forEach(function(ev){ if(!ev.responses) ev.responses = {}; });
  sortMemberList(s.members);
  return s;
}
function migrateMe(){
  if(!me) return;
  if(memberById(me)) return;
  var byName = null;
  state.members.forEach(function(m){ if(m.name === me) byName = m; });
  if(byName){ me = byName.id; safeSet("liberty_me", me); }
  else { me = null; safeDel("liberty_me"); }
}

/* ---------- 集計 ---------- */
function counts(ev){
  var c = { am:0, pm:0, undecided:0, absent:0 };
  var r = ev.responses || {};
  state.members.forEach(function(m){
    var v = r[m.id];
    if(v === "allday") c.am++;            /* 以前の「終日参加」は午前に数えます */
    else if(v && c[v] !== undefined) c[v]++;
  });
  c.attend = c.am + c.pm;                  /* 出席＝午前＋午後（以前の終日も午前に算入） */
  c.total = c.attend;
  c.answered = c.am + c.pm + c.undecided + c.absent;
  c.unanswered = Math.max(0, state.members.length - c.answered);
  return c;
}
function groupOf(ev, key){
  var r = ev.responses || {};
  return state.members.filter(function(m){
    var v = r[m.id];
    if(key === "am") return v === "am" || v === "allday";
    return v === key;
  });
}
function unansweredOf(ev){
  var r = ev.responses || {};
  return state.members.filter(function(m){ return !r[m.id] || CHOICE_KEYS.indexOf(r[m.id]) < 0; });
}

/* ---------- 日付 ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parts(s){
  var a = String(s||"").split("-").map(Number);
  var d = new Date(a[0], (a[1]||1)-1, a[2]||1);
  return { y:a[0], m:a[1], d:a[2], w:WEEK[d.getDay()] };
}
function dateLabel(s){ var p = parts(s); return p.m+"月"+p.d+"日（"+p.w+"）"; }
function dateLabelShort(s){ var p = parts(s); return p.m+"/"+p.d+"（"+p.w+"）"; }
function sortByDate(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }
function esc(s){
  return String(s===undefined||s===null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- 画面部品 ---------- */
function typeClass(t){
  var k = String(t||"その他");
  if(["練習","試合","大会","練習試合"].indexOf(k) < 0) k = "その他";
  return "t-"+k;
}
function totalBox(c, evId){
  /* 参加人数（午前＋午後）。押すと参加する人の名前が出ます */
  return '<button class="total tappable" data-act="cell" data-cat="attend" data-id="'+(evId||"")+'">'+
    '<span class="n">'+c.total+'</span><span class="tl">人<br>参加</span>'+
    '<span class="tchev">›</span></button>';
}
function countGrid(c, evId){
  /* 4つの人数。タップすると、その名前が出ます */
  var items = [
    ["am","午前",c.am], ["pm","午後",c.pm],
    ["undecided","調整中",c.undecided], ["absent","欠席",c.absent]
  ];
  var g = '<div class="cgrid4">' + items.map(function(it){
    return '<div class="cell c-'+it[0]+'" data-act="cell" data-cat="'+it[0]+'" data-id="'+evId+'" role="button" tabindex="0">'+
      '<div class="n">'+it[2]+'</div><div class="l">'+it[1]+'</div></div>';
  }).join("") + '</div>';
  if(c.unanswered){
    g += '<div class="unrow" data-act="cell" data-cat="none" data-id="'+evId+'" role="button" tabindex="0">'+
      '<span>未回答</span><span class="un">'+c.unanswered+'人</span><span class="tchev">›</span></div>';
  }
  return g;
}
/* 一覧の4行（出席・欠席・調整中・未回答）。押すと名前が出ます */
function statRows(c, evId, onDark){
  var rows = [
    ["attend", "出席",   c.attend],
    ["absent", "欠席",   c.absent],
    ["undecided","調整中", c.undecided],
    ["none",   "未回答", c.unanswered]
  ];
  return '<div class="stats'+(onDark?" onDark":"")+'">'+rows.map(function(r){
    return '<div class="strow st-'+r[0]+'" data-act="cell" data-cat="'+r[0]+'" data-id="'+evId+'" role="button" tabindex="0">'+
      '<span class="stdot"></span>'+
      '<span class="stlabel">'+r[1]+'</span>'+
      '<span class="stnum">'+r[2]+'<span class="stu">人</span></span>'+
      '<span class="stchev">›</span></div>';
  }).join("")+'</div>';
}
function eventCard(ev, adminMode){
  var c = counts(ev);
  var btns = adminMode
    ? '<div class="rowbtns"><button class="bedit" data-act="edit-event" data-id="'+ev.id+'">編集</button><button class="bdel" data-act="del-event" data-id="'+ev.id+'">削除</button></div>'
    : "";
  var items = [
    ["am","午前",c.am], ["pm","午後",c.pm],
    ["undecided","調整中",c.undecided], ["absent","欠席",c.absent]
  ];
  return '<div class="card day">'+
      '<div class="dayhead" data-act="open-event" data-id="'+ev.id+'" role="button" tabindex="0">'+
        '<div class="daytop"><span class="evdate">'+dateLabel(ev.date)+'</span>'+
          '<span class="ctype '+typeClass(ev.type)+'">'+esc(ev.type)+'</span>'+
          (ev.date >= todayStr() ? '' : '<span class="pastmark">終了</span>')+'</div>'+
        (ev.place ? '<div class="cplace">'+PLACE_ICON+'<span>'+esc(ev.place)+'</span></div>' : "")+
      '</div>'+
      '<div class="daycount"><span class="dcl">参加</span><span class="dcn">'+c.attend+'</span><span class="dcu">人</span>'+
        '<span class="dcn2">（午前'+c.am+'・午後'+c.pm+'）</span></div>'+
      '<div class="cgrid4">'+items.map(function(it){
        return '<div class="cell c-'+it[0]+'" data-act="cell" data-cat="'+it[0]+'" data-id="'+ev.id+'" role="button" tabindex="0">'+
          '<div class="n">'+it[2]+'</div><div class="l">'+it[1]+'</div></div>';
      }).join("")+'</div>'+
      (c.unanswered ? '<div class="unrow" data-act="cell" data-cat="none" data-id="'+ev.id+'" role="button" tabindex="0"><span>未回答</span><span class="un">'+c.unanswered+'人</span><span class="tchev">›</span></div>' : '')+
      '<div class="openhint" data-act="open-event" data-id="'+ev.id+'" role="button" tabindex="0"><span>詳細を見る</span><span class="ar">›</span></div>' +
    btns + '</div>';
}
function heroCard(ev){
  var c = counts(ev);
  return '<div class="hero">'+
    '<span class="hlabel">次はこれ！</span>'+
    '<div class="hdate">'+dateLabel(ev.date)+'</div>'+
    statRows(c, ev.id, true) +
    '<button class="go" data-act="open-event" data-id="'+ev.id+'">出欠を入力する</button>'+
  '</div>';
}

/* ---------- 画面：ホーム ---------- */
/* 一覧の表：月日と4つの人数だけ。人数を押すと名前が出ます */
function renderTable(evs){
  var head = '<tr><th class="thd">月日</th><th class="t-attend">出席</th><th class="t-absent">欠席</th>'+
    '<th class="t-undecided">調整中</th><th class="t-none">未回答</th></tr>';
  var body = evs.map(function(ev){
    var c = counts(ev), p = parts(ev.date);
    function td(cat, label, n){
      return '<td class="tc t-'+cat+'" data-act="cell" data-cat="'+cat+'" data-id="'+ev.id+'" role="button" tabindex="0">'+
        '<span class="tnum">'+n+'</span></td>';
    }
    return '<tr><td class="tdt" data-act="open-event" data-id="'+ev.id+'" role="button" tabindex="0">'+
        '<span class="tm">'+p.m+'/'+p.d+'</span><span class="tw">（'+p.w+'）</span></td>'+
      td("attend","出席",c.attend)+td("absent","欠席",c.absent)+
      td("undecided","調整中",c.undecided)+td("none","未回答",c.unanswered)+'</tr>';
  }).join("");
  return '<div class="tblwrap"><table class="tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="tblnote">人数を押すと、お名前が出ます。</div>';
}

/* 4分割のタイル：月日と4つの人数だけ。人数を押すと名前、下の「詳細を見る」で中身 */
function quickTile(ev){
  var c = counts(ev);
  var p = parts(ev.date);
  function row(cat, label, n, cls){
    return '<div class="qrow '+cls+'" data-act="cell" data-cat="'+cat+'" data-id="'+ev.id+'" role="button" tabindex="0">'+
      '<span class="qdot"></span><span class="ql">'+label+'</span><b>'+n+'<i>人</i></b></div>';
  }
  return '<div class="qtile">'+
    '<div class="qdate">'+p.m+'月'+p.d+'日<span class="qw">（'+p.w+'）</span></div>'+
    row("attend","出席",c.attend,"q-attend")+
    row("absent","欠席",c.absent,"q-absent")+
    row("undecided","調整中",c.undecided,"q-undecided")+
    row("none","未回答",c.unanswered,"q-none")+
    '<div class="qmore" data-act="open-event" data-id="'+ev.id+'" role="button" tabindex="0">詳細を見る ›</div>'+
  '</div>';
}

function renderHome(){
  var isAdmin = !!adminPin;
  var key = currentMonthKey();
  var evs = monthEvents(key);
  var html = renderMonthBar();

  html += '<div class="sectitle first" style="margin-top:6px">'+
    (evs.length ? 'この月の出欠（'+evs.length+'件）' : 'この月の予定')+'</div>';
  if(evs.length){
    html += renderTable(evs);
    html += '<div class="sectitle">各日の詳細</div>';
    html += evs.map(function(e){ return eventCard(e, false); }).join("");
  } else {
    html += '<div class="empty"><div class="e1">この月の予定はありません</div>'+
      '「‹」「›」で月を切り替えられます。</div>';
  }

  if(isAdmin && evs.length){
    html += '<div class="sectitle">予定の編集・削除</div>';
    html += evs.map(function(e){
      var btns = '<div class="rowbtns"><button class="bedit" data-act="edit-event" data-id="'+e.id+'">編集</button><button class="bdel" data-act="del-event" data-id="'+e.id+'">削除</button></div>';
      return '<div class="card adminonly"><div class="evdate" style="font-size:1.1rem">'+dateLabel(e.date)+'　'+esc(e.type)+'</div>'+btns+'</div>';
    }).join("");
  }

  if(isAdmin){

/* ---------- 月間の出欠 ---------- */
var monthSel = null;      /* "2026-10" */
var mOpen = null;         /* 開いている項目 */
var noScrollNext = false; /* 開閉のときは画面を上に戻さない */

function monthKeyOf(d){ return String(d||"").slice(0,7); }
function monthLabelJP(key){ var a=String(key).split("-"); return Number(a[0])+"年"+Number(a[1])+"月"; }
function allMonths(){
  var seen = {}, arr = [];
  state.events.forEach(function(e){
    var k = monthKeyOf(e.date);
    if(k.length === 7 && !seen[k]){ seen[k] = 1; arr.push(k); }
  });
  arr.sort();
  return arr;
}
function currentMonthKey(){
  var ms = allMonths(), tk = todayStr().slice(0,7);
  if(monthSel) return monthSel;   /* 予定がない月も見られるように、選んだ月をそのまま使う */
  if(ms.indexOf(tk) >= 0) return tk;
  if(ms.length) return ms[ms.length-1];
  return monthSel || tk;
}
function shiftMonth(dir){
  var ms = allMonths(), k = currentMonthKey();
  var y = Number(k.slice(0,4)), m = Number(k.slice(5,7)) + dir;
  if(m < 1){ m = 12; y--; }
  if(m > 12){ m = 1; y++; }
  monthSel = y+"-"+(m<10?"0":"")+m;
  mOpen = null;
  return ms.indexOf(monthSel) >= 0;
}
function monthEvents(key){
  return state.events.filter(function(e){ return monthKeyOf(e.date) === key; }).sort(sortByDate);
}
/* 同じ月に予定が複数あるときは、いちばん新しい回答で1人1回に数えます */
function monthSummary(key){
  var evs = monthEvents(key), best = {};
  evs.forEach(function(ev){
    var r = ev.responses || {};
    state.members.forEach(function(mm){
      var v = r[mm.id];
      if(!v || CHOICE_KEYS.indexOf(v) < 0) return;
      if(!best[mm.id] || ev.date >= best[mm.id].date) best[mm.id] = { choice:v, date:ev.date };
    });
  });
  var g = { attend:[], absent:[], pending:[] };
  state.members.forEach(function(mm){
    var b = best[mm.id];
    if(!b) return;
    var cat = (b.choice === "allday" || b.choice === "am" || b.choice === "pm")
      ? "attend" : (b.choice === "absent" ? "absent" : "pending");
    g[cat].push({ m:mm, choice:b.choice, date:b.date });
  });
  return { events:evs, groups:g, answered:Object.keys(best).length };
}
var META_M = {
  attend:{ label:"出席",   cls:"m-attend" },
  absent:{ label:"欠席",   cls:"m-absent" },
  pending:{ label:"調整中", cls:"m-pending" }
};
function choiceTag(choice){
  var lab = choiceLabel(choice);
  if(!lab) return "";
  var cls = (choice === "allday") ? "am" : choice;
  return '<span class="ptag t-'+cls+'">'+esc(lab)+'</span>';
}
function renderMonthBar(){
  var key = currentMonthKey();
  return '<div class="mbar">'+
    '<button class="mnav" data-act="month-prev" aria-label="前の月">‹</button>'+
    '<div class="mtitle" id="monthTitle">'+esc(monthLabelJP(key))+'</div>'+
    '<button class="mnav" data-act="month-next" aria-label="次の月">›</button>'+
  '</div>';
}
function renderMonthSection(){
  var key = currentMonthKey();
  var sum = monthSummary(key);
  var multi = sum.events.length > 1;
  var h = '<div class="sectitle">月間の出欠</div><div class="mcard">';
  h += '<div class="msub">'+(sum.events.length ? '予定 '+sum.events.length+'件　回答 '+sum.answered+'人' : 'この月の予定はありません')+'</div>';
  if(sum.events.length){
    ["attend","absent","pending"].forEach(function(cat){
      var meta = META_M[cat], list = sum.groups[cat], open = (mOpen === cat);
      h += '<button class="mrow '+meta.cls+(open?" open":"")+'" data-act="month-toggle" data-cat="'+cat+'" aria-expanded="'+(open?"true":"false")+'">'+
        '<span class="mdot"></span><span class="mlabel">'+meta.label+'</span>'+
        '<span class="mnum">'+list.length+'<small>人</small></span>'+
        '<span class="mchev">▾</span></button>';
      if(open){
        h += '<div class="mlist">';
        if(!list.length){
          h += '<div class="mempty">まだいません</div>';
        } else {
          list.forEach(function(it){
            h += '<div class="mperson">'+
              (hasNum(it.m) ? '<span class="pnum">'+esc(it.m.number)+'</span>' : '')+
              '<span class="pn">'+esc(it.m.name)+(multi ? '<span class="pdate">'+esc(dateLabelShort(it.date))+'</span>' : '')+'</span>'+
              choiceTag(it.choice)+'</div>';
          });
        }
        h += '</div>';
      }
    });
    h += '<div class="mfoot">'+(multi ? '同じ月に予定が複数あるときは、いちばん新しい回答で数えています。' : '項目を押すと、お名前が出ます。')+'</div>';
  } else {
    h += '<div class="mempty" style="padding:12px 0 18px">この月に予定はありません。</div>';
  }
  h += '</div>';
  return h;
}

/* --- 暗証番号 --- */
function modalPinEntry(msg, onOk){
  var buf = "";
  function paint(){
    var dots = "";
    for(var i=0;i<4;i++) dots += '<i class="'+(i<buf.length?"on":"")+'"></i>';
    document.getElementById("pinDots").innerHTML = dots;
    var e = document.getElementById("pinErr"); if(e) e.textContent = "";
  }
  window.__pinSubmit = function(){
    if(buf.length < 4) return;
    onOk(buf);
    buf = "";
  };
  window.__pinPad = function(v){
    if(v === "del"){ buf = buf.slice(0,-1); }
    else if(v === "ok"){ window.__pinSubmit(); return; }
    else if(buf.length < 4){ buf += v; }
    paint();
    if(buf.length === 4){ setTimeout(window.__pinSubmit, 160); }
  };
  openModal('<h2>'+esc(msg)+'</h2><div class="sub">管理者の4けたの暗証番号を入力してください。</div>'+
    '<div class="pindots" id="pinDots"></div><div class="err" id="pinErr"></div>'+
    pinPadHTML()+
    '<button class="qbtn" style="margin-top:14px" data-act="close">やめる</button>');
  paint();
}

/* ---------- 操作 ---------- */
function applyState(s){
  if(s && s.events){ state = normalizeState({ members:s.members||[], events:s.events||[], settings:s.settings||{} }); }
  if(me && !memberById(me)){ me = null; safeDel("liberty_me"); }
  render();
}

function submitAnswer(evId){
  var ev = findEvent(evId); if(!ev || !me) return;
  var sel = document.querySelector('.opt.sel');
  if(!sel){ toast("先に5つのボタンから1つ押してください"); return; }
  var choice = sel.getAttribute("data-choice");
  var chosen = CHOICES.filter(function(c){ return c.key === choice; })[0];
  mutate("/events/"+evId+"/answer", "POST", { member: me, choice: choice })
    .then(function(s){ applyState(s); toast(chosen.label+" で登録しました"); })
    .catch(function(e){ toast("登録できませんでした："+e.message); });
}

function saveEvent(id){
  var date = (document.getElementById("fDate")||{}).value || "";
  var type = ((document.getElementById("fType")||{}).value || "").trim();
  var place = ((document.getElementById("fPlace")||{}).value || "").trim();
  if(!date){ toast("日付を入れてください"); return; }
  if(!type){ toast("内容を入れてください（例：練習）"); return; }
  var p = id
    ? mutate("/events/"+id, "PUT", { date:date, type:type, place:place })
    : mutate("/events", "POST", { date:date, type:type, place:place });
  p.then(function(s){
    closeModal();
    applyState(s);
    toast(id ? "予定を保存しました" : "予定を登録しました");
  }).catch(function(e){ toast("保存できませんでした："+e.message); });
}

function deleteEvent(id){
  var ev = findEvent(id);
  openModal('<h2>この予定を削除しますか？</h2><div class="sub">'+(ev?dateLabel(ev.date)+" "+esc(ev.type):"")+'<br>出欠の回答もすべて消えます。元には戻せません。</div>'+
    '<button class="qbtn warn" data-act="confirm-del-event" data-id="'+id+'">削除する</button>'+
    '<button class="qbtn" data-act="close">やめる</button>');
}

function verifyPin(pin){
  if(MODE === "server"){
    return req("/verify", "POST", { pin: pin }, pin).then(function(){ return true; }).catch(function(){ return false; });
  }
  var p = (state.settings && state.settings.pin) || "0000";
  return Promise.resolve(p === pin);
}

/* ---------- クリック処理 ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id");
  var name = t.getAttribute("data-name");
  var cat = t.getAttribute("data-cat");

  switch(act){
    case "mask-close": if(e.target.classList.contains("mask")) closeModal(); break;
    case "close": closeModal(); break;
    case "home": location.hash = "#/"; break;

    case "open-event": location.hash = "#/e/"+id; break;
    case "cell": modalCellList(id, cat); break;

    case "month-prev": shiftMonth(-1); noScrollNext = true; render(); break;
    case "month-next": shiftMonth(1); noScrollNext = true; render(); break;
    case "month-toggle":
      mOpen = (mOpen === cat) ? null : cat;
      noScrollNext = true; render();
      if(mOpen){
        var rowEl = document.querySelector('.mrow.'+(META_M[cat] ? META_M[cat].cls : ''));
        if(rowEl && rowEl.scrollIntoView) setTimeout(function(){ rowEl.scrollIntoView({block:"center", behavior:"smooth"}); }, 30);
      }
      break;

    case "pick-name": modalPickName(); break;
    case "set-me": {
      var meM = memberById(id);
      if(!meM) break;
      me = meM.id; safeSet("liberty_me", me); closeModal(); render();
      toast(dispName(meM)+"、こんにちは！");
      break;
    }

    case "choose":
      Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){ b.classList.remove("sel"); });
      t.classList.add("sel");
      var sb = document.querySelector('[data-act="submit-answer"]');
      if(sb) sb.disabled = false;
      break;
    case "submit-answer": submitAnswer(id); break;

    case "admin":
      if(adminPin){ location.hash = "#/admin"; render(); break; }
      modalPinEntry("管理者メニュー", function(pin){
        verifyPin(pin).then(function(ok){
          if(ok){ adminPin = pin; sessSet("liberty_pin", pin); closeModal(); location.hash = "#/admin"; render(); toast("管理モードに入りました"); }
          else { var el = document.getElementById("pinErr"); if(el) el.textContent = "暗証番号がちがいます"; }
        });
      });
      break;
    case "admin-off":
      adminPin = null; sessSet("liberty_pin", null); location.hash = "#/"; render(); toast("管理モードを終了しました");
      break;
    case "add-event": modalEventForm(null); break;
    case "edit-event": modalEventForm(findEvent(id)); break;
    case "del-event": deleteEvent(id); break;
    case "confirm-del-event":
      mutate("/events/"+id, "DELETE").then(function(s){ closeModal(); applyState(s); toast("予定を削除しました"); })
        .catch(function(err){ toast("削除できませんでした："+err.message); });
      break;
    case "set-type":
      var ti = document.getElementById("fType");
      if(ti) ti.value = t.getAttribute("data-type");
      Array.prototype.forEach.call(document.querySelectorAll(".tchip"), function(b){ b.classList.remove("on"); });
      t.classList.add("on");
      break;
    case "save-event": saveEvent(id || null); break;

    case "members": modalMembers(); break;
    case "add-member": modalMemberForm(null); break;
    case "edit-member": modalMemberForm(id); break;
    case "save-member": {
      var numEl = document.getElementById("fNum"), nmEl = document.getElementById("fName");
      var numRaw = ((numEl && numEl.value) || "").trim();
      var nmv = ((nmEl && nmEl.value) || "").trim();
      if(!nmv){ toast("ニックネームを入れてください"); break; }
      var num = null;
      if(numRaw !== ""){
        if(!/^\d{1,3}$/.test(numRaw)){ toast("背番号は数字で入れてください"); break; }
        num = parseInt(numRaw, 10);
      }
      var dupN = null, dupName = null;
      state.members.forEach(function(mm){
        if(id && mm.id === id) return;
        if(num !== null && hasNum(mm) && Number(mm.number) === num) dupN = mm;
        if(mm.name === nmv) dupName = mm;
      });
      if(dupN){ toast("背番号 "+num+" は "+dupN.name+" が使っています"); break; }
      if(dupName){ toast("「"+nmv+"」はすでに登録されています"); break; }
      var pm = id ? mutate("/members/"+id, "PUT", { name:nmv, number:num })
                  : mutate("/members", "POST", { name:nmv, number:num });
      pm.then(function(s){ applyState(s); modalMembers(); toast(id ? "変更しました" : "追加しました"); })
        .catch(function(err){ toast("できませんでした："+err.message); });
      break;
    }
    case "del-member": {
      var dm = memberById(id);
      openModal('<h2>このメンバーを削除しますか？</h2><div class="sub">'+esc(dm?dispName(dm):"")+'<br>この人の出欠の回答も消えます。元には戻せません。</div>'+
        '<button class="qbtn warn" data-act="confirm-del-member" data-id="'+id+'">削除する</button>'+
        '<button class="qbtn" data-act="close">やめる</button>');
      break;
    }
    case "confirm-del-member":
      mutate("/members/"+id, "DELETE").then(function(s){ applyState(s); modalMembers(); toast("削除しました"); })
        .catch(function(err){ toast("削除できませんでした："+err.message); });
      break;

    case "change-pin": {
      var buf = "", stage = 1, newPin = "";
      openModal('<h2>暗証番号を変更</h2><div class="sub">新しい4けたの数字を入力してください。</div>'+
        '<div class="pindots" id="pinDots"></div><div class="err" id="pinErr"></div>'+
        pinPadHTML()+'<button class="qbtn" style="margin-top:14px" data-act="close">やめる</button>');
      function submitNewPin(){
        if(buf.length !== 4) return;
        newPin = buf; buf = "";
        var p = (MODE === "server")
          ? req("/pin", "POST", { pin: newPin })
          : applyLocal(function(){ state.settings.pin = newPin; });
        p.then(function(){ closeModal(); render(); toast("暗証番号を変更しました（"+newPin+"）"); })
         .catch(function(err){ var el = document.getElementById("pinErr"); if(el) el.textContent = "変更できませんでした：" + err.message; });
      }
      window.__pinPad = function(v){
        if(v === "del"){ buf = buf.slice(0,-1); }
        else if(v === "ok"){ submitNewPin(); return; }
        else if(buf.length < 4){ buf += v; }
        paintDots(buf);
        if(buf.length === 4){ setTimeout(submitNewPin, 160); }
      };
      paintDots("");
      break;
    }
    case "pin": if(window.__pinPad) window.__pinPad(t.getAttribute("data-v")); break;
  }
});
function pinPadHTML(){
  var pad = "";
  ["1","2","3","4","5","6","7","8","9"].forEach(function(n){
    pad += '<button data-act="pin" data-v="'+n+'">'+n+'</button>';
  });
  pad += '<button class="act" data-act="pin" data-v="del">←</button><button data-act="pin" data-v="0">0</button><button class="act" data-act="pin" data-v="ok">決定</button>';
  return '<div class="pinpad">'+pad+'</div>';
}
function paintDots(buf){
  var d = document.getElementById("pinDots");
  if(!d) return;
  var s = ""; for(var i=0;i<4;i++){ s += '<i class="'+(i<buf.length?"on":"")+'"></i>'; }
  d.innerHTML = s;
}

/* ---------- 自動更新（共有データを最新に） ---------- */
function startLive(){
  clearInterval(liveTimer);
  liveTimer = setInterval(function(){
    if(document.hidden) return;
    if(document.querySelector(".mask")) return;
    loadState().then(function(){ render(); });
  }, 20000);
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && !document.querySelector(".mask")){ loadState().then(function(){ render(); }); }
});

/* ---------- 起動 ---------- */
window.addEventListener("hashchange", render);

loadState().then(function(){
  me = safeGet("liberty_me") || null;
  adminPin = sessGet("liberty_pin") || null;
  migrateMe();
  if(adminPin){ verifyPin(adminPin).then(function(ok){ if(!ok){ adminPin = null; sessSet("liberty_pin", null); render(); } }); }
  render();
  startLive();
  if(!me){ setTimeout(modalPickName, 260); }
});
})();
